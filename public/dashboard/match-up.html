<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match-up</title>

    <script src="../js/sessao.js"></script>

    <link rel="stylesheet" href="../css/global-dash.css">
    <link rel="stylesheet" href="../css/match-up.css">
    <link rel="stylesheet" href="../css/header-left.css">
    <link rel="icon" href="../assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

    <div class="header-top">
        <a href="home.html" class="logo">
            <span>O Duelista</span>
            <img src="../assets/icon/riven_icon_1.png" alt="SwordRiven">
        </a>
        <div class="area-usuario">
            <span>Olá, Usuário</span>
            <img class="avatar-riven" src="../assets/imgs/avatar_riven.png" alt="Avatar">
        </div>
    </div>

    <div class="container-home-header-left">

        <div class="header-left">
            <nav class="menu">
                <a href="home.html" class="efeito-hover-side">
                    <img class="icon-home" src="../assets/icon/icon-home.svg" alt="icon-home">
                    <span>Home</span></a>
                <a href="match-up.html" class="efeito-hover-side ativo">
                    <img class="icon-match" src="../assets/icon/icon-match.svg" alt="icon-match">
                    <span>Match-ups</span></a>
                <a href="build.html" class="efeito-hover-side">
                    <img class="icon-build" src="../assets/icon/icon-build.svg" alt="icon-build">
                    <span>Runas e Builds</span></a>
                <a href="quiz.html" class="efeito-hover-side">
                    <img class="icon-quiz" src="../assets/icon/icon-quiz.svg" alt="icon-quiz">
                    <span>Quiz</span></a>
                <a href="rank.html" class="efeito-hover-side">
                    <img class="icon-bar" src="../assets/icon/icon-bar.svg" alt="icon-bar">
                    <span>Ranks</span></a>
            </nav>
            <a href="../index.html" class="sair">Sair</a>
        </div>

        <main class="match-up">
            <div class="titulo-match-up"> 
                <H1>Escolha o campeão</H1>
                <p>Selecione o inimigo para ver a match-up contra a Riven</p>
            </div>
            <div class="filtros-match-up">
                <input type="text" id="ipt_campeao" placeholder="Pesquisar campeão...">
                <button class="filtro filtro-ativo">Todos</button>
                <button class="filtro lutador">Lutadores</button>
                <button class="filtro tanque">Tanques</button>
                <button class="filtro mago">Magos</button>
                <button class="filtro favoritos">Favoritos</button>
            </div>
            <div class="painel-match"></div>
            <div class="match-up-escolhida">
                <p>Match-up escolhida</p>
                <h2 id="nome_match_up">Selecione um campeão</h2>
                <button class="ver-match-up">Ver match-up</button>
            </div>
        </main>

    </div>

</body>

</html>
<script>
    // Guarda o ID do campeão clicado para usar nas próximas ações da match-up.
    let id_campeao_selecionado = null;

    // Busca os campeões assim que o navegador chega a este script, após o HTML da tela.
    carregar_campeoes();

    function carregar_campeoes() {
        let painel_match = document.querySelector(".painel-match");
        painel_match.textContent = "Carregando campeões...";

        // fetch faz uma requisição GET. O primeiro then recebe a resposta da API.
        fetch("/campeao/listar").then(function (resposta) {
            // ok indica sucesso HTTP. Um erro lançado aqui será tratado pelo catch abaixo.
            if (resposta.ok) {
                // json transforma o JSON da resposta em dados que o JavaScript pode usar.
                return resposta.json();
            } else {
                throw new Error("Não foi possível buscar os campeões.");
            }
        }).then(function (campeoes) {
            // Este segundo then recebe os dados depois que resposta.json() termina.
            painel_match.textContent = "";

            if (campeoes.length == 0) {
                painel_match.textContent = "Nenhum campeão cadastrado.";
            } else {
                // Cada registro retornado pela rota vira um botão com imagem e nome.
                for (let i = 0; i < campeoes.length; i++) {
                    let campeao = campeoes[i];
                    let card_campeao = document.createElement("button");
                    let imagem_campeao = document.createElement("img");
                    let nome_campeao = document.createElement("span");

                    card_campeao.type = "button";
                    card_campeao.classList.add("card_campeao");
                    // dataset guarda o ID do banco no atributo data-id do próprio card.
                    card_campeao.dataset.id = campeao.id;
                    card_campeao.setAttribute("aria-pressed", "false");
                    imagem_campeao.src = campeao.loadingScreenIMG;
                    imagem_campeao.alt = campeao.nome;
                    nome_campeao.textContent = campeao.nome;

                    // this é o botão clicado, permitindo ler seu ID e seu nome.
                    card_campeao.onclick = function () {
                        selecionar_campeao(this);
                    };

                    // appendChild coloca a imagem e o nome no card, e o card no painel.
                    card_campeao.appendChild(imagem_campeao);
                    card_campeao.appendChild(nome_campeao);
                    painel_match.appendChild(card_campeao);
                }
            }
        }).catch(function (erro) {
            // catch recebe falhas de conexão, erros HTTP lançados e falhas ao ler o JSON.
            painel_match.textContent = "Não foi possível carregar os campeões. Tente recarregar a página.";
            console.error("Erro ao carregar campeões:", erro);
        });
    }

    function selecionar_campeao(card_campeao) {
        // Remove a seleção anterior para manter somente um campeão selecionado.
        let cards_campeao = document.querySelectorAll(".card_campeao");

        for (let i = 0; i < cards_campeao.length; i++) {
            cards_campeao[i].classList.remove("card_campeao_selecionado");
            cards_campeao[i].setAttribute("aria-pressed", "false");
        }

        // dataset devolve texto; Number converte o ID para um número.
        id_campeao_selecionado = Number(card_campeao.dataset.id);
        card_campeao.classList.add("card_campeao_selecionado");
        card_campeao.setAttribute("aria-pressed", "true");
        document.getElementById("nome_match_up").textContent =
            "Riven vs " + card_campeao.querySelector("span").textContent;
    }
</script>
