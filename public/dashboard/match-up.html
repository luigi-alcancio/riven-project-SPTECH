<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <script src="../js/sessao.js"></script>

    <link rel="stylesheet" href="../css/global-dash.css">
    <link rel="stylesheet" href="../css/match-up.css">
    <link rel="stylesheet" href="../css/header-left.css">
    <link rel="icon" href="../assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

    <div class="header-top">
        <a href="home.html" class="logo">
            <span>O Duelista</span>
            <img src="../assets/icon/riven_icon_1.png" alt="SwordRiven">
        </a>
        <div class="area-usuario">
            <span>Olá, Usuário</span>
            <img class="avatar-riven" src="../assets/imgs/avatar_riven.png" alt="Avatar">
        </div>
    </div>

    <div class="container-home-header-left">

        <div class="header-left">
            <nav class="menu">
                <a href="home.html" class="efeito-hover-side">
                    <img class="icon-home" src="../assets/icon/icon-home.svg" alt="icon-home">
                    <span>Home</span></a>
                <a href="match-up.html" class="efeito-hover-side ativo">
                    <img class="icon-match" src="../assets/icon/icon-match.svg" alt="icon-match">
                    <span>Match-ups</span></a>
                <a href="build.html" class="efeito-hover-side">
                    <img class="icon-build" src="../assets/icon/icon-build.svg" alt="icon-build">
                    <span>Runas e Builds</span></a>
                <a href="quiz.html" class="efeito-hover-side">
                    <img class="icon-quiz" src="../assets/icon/icon-quiz.svg" alt="icon-quiz">
                    <span>Quiz</span></a>
                <a href="rank.html" class="efeito-hover-side">
                    <img class="icon-bar" src="../assets/icon/icon-bar.svg" alt="icon-bar">
                    <span>Ranks</span></a>
            </nav>
            <a href="../index.html" class="sair">Sair</a>
        </div>

        <main class="match-up">
            <div class="titulo-match-up"> 
                <H1>Escolha o campeão</H1>
                <p>Selecione o inimigo para ver a match-up contra a Riven</p>
            </div>
            <div class="filtros-match-up">
                <input type="text" id="ipt_campeao" placeholder="Pesquisar campeão...">
                <button class="filtro">Todos</button>
                <button class="filtro lutador">Lutadores</button>
                <button class="filtro tanque">Tanques</button>
                <button class="filtro mago">Magos</button>
            </div>
            <div class="painel-match"></div>
            <div class="match-up-escolhida">
                <p>Match-up escolhida</p>
                <h2>Riven vs Aatrox</h2>
                <button class="ver-match-up"></button>
            </div>
        </main>

    </div>

</body>

</html>

</script>
