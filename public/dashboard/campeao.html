<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campeão</title>

    <script src="../js/sessao.js"></script>

    <link rel="stylesheet" href="../css/global-dash.css">
    <link rel="stylesheet" href="../css/campeao.css">
    <link rel="stylesheet" href="../css/header-left.css">
    <link rel="icon" href="../assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

    <div class="header-top">
        <a href="home.html" class="logo">
            <span>O Duelista</span>
            <img src="../assets/icon/riven_icon_1.png" alt="SwordRiven">
        </a>
        <div class="area-usuario">
            <span>Olá, Usuário</span>
            <img class="avatar-riven" src="../assets/imgs/avatar_riven.png" alt="Avatar">
        </div>
    </div>

    <div class="container-home-header-left">

        <div class="header-left">
            <nav class="menu">
                <a href="home.html" class="efeito-hover-side">
                    <img class="icon-home" src="../assets/icon/icon-home.svg" alt="icon-home">
                    <span>Home</span></a>
                <a href="match-up.html" class="efeito-hover-side ativo">
                    <img class="icon-match" src="../assets/icon/icon-match.svg" alt="icon-match">
                    <span>Match-ups</span></a>
                <a href="build.html" class="efeito-hover-side">
                    <img class="icon-build" src="../assets/icon/icon-build.svg" alt="icon-build">
                    <span>Runas e Builds</span></a>
                <a href="quiz.html" class="efeito-hover-side">
                    <img class="icon-quiz" src="../assets/icon/icon-quiz.svg" alt="icon-quiz">
                    <span>Quiz</span></a>
                <a href="rank.html" class="efeito-hover-side">
                    <img class="icon-bar" src="../assets/icon/icon-bar.svg" alt="icon-bar">
                    <span>Ranks</span></a>
            </nav>
            <a href="../index.html" class="sair">Sair</a>
        </div>

        <main class="main-campeao">
            <div class="conteudo-superior" id="conteudo_superior">
                <div class="dicas-container">
                    <p class="subtitulo-superior">Riven vs</p>
                    <div class="linha_nome_campeao">
                        <h1 class="nome-champ" id="nome_campeao">Carregando...</h1>
                        <button type="button" class="botao_favoritar" id="btn_favoritar" onclick="favoritar_match_up()" title="Favoritar match-up" disabled>
                            <svg class="icone_coracao" viewBox="-1 -1 26 26" xmlns="http://www.w3.org/2000/svg">
                                <g transform="translate(0 -1028.4)">
                                    <path d="m7 1031.4c-1.5355 0-3.0784 0.5-4.25 1.7-2.3431 2.4-2.2788 6.1 0 8.5l9.25 9.8 9.25-9.8c2.279-2.4 2.343-6.1 0-8.5-2.343-2.3-6.157-2.3-8.5 0l-0.75 0.8-0.75-0.8c-1.172-1.2-2.7145-1.7-4.25-1.7z" />
                                </g>
                            </svg>
                        </button>
                    </div>
                    <p class="descricao-champ cor-destaque" id="descricao_campeao"></p>
                    <p class="cor-destaque subtitulo">Principais dicas</p>
                    <ul>
                        <li class="primeira-dica" id="dica_geral_1"></li>
                        <li class="segunda-dica" id="dica_geral_2"></li>
                        <li class="terceira-dica" id="dica_geral_3"></li>
                    </ul>
                </div>
                <div class="card-container">
                    <div class="card-dificuldade">
                        <div class="linha-dificuldade" id="indicadores_dificuldade">
                            <div class="parametro"></div>
                            <div class="parametro"></div>
                            <div class="parametro"></div>
                        </div>
                        <p>Dificuldade</p>
                        <span class="cor-destaque nivel-dificuldade" id="dificuldade_campeao"></span>
                    </div>
                </div>
            </div>
            <div class="conteudo-inferior">
                <div class="linha-botao" id="botoes_nivel">
                    <button class="botao botao-ativo" id="btn_nivel_1_5" onclick="mostrar_dica_nivel(1)" disabled>Nivel 1 ao 5</button>
                    <button class="botao" id="btn_nivel_6_11" onclick="mostrar_dica_nivel(2)" disabled>Nivel 6 ao 11</button>
                    <button class="botao" id="btn_nivel_12_max" onclick="mostrar_dica_nivel(3)" disabled>Nivel 12 ao máximo</button>
                </div>
                <div class="container-dica-nivel">
                    <h3 id="titulo_dica_nivel">Nivel 1 ao 5</h3>
                    <p class="dica-nivel" id="dica_nivel"></p>
                </div>
                <div class="container-dica-ouro">
                    <img src="../assets/icon/icon-star.svg" alt="estrela-amarela">
                    <h3 class="cor-destaque">Dica de ouro:</h3>
                    <p class="dica-ouro" id="dica_ouro"></p>
                </div>
            </div>

        </main>

    </div>

</body>

</html>
<script>
    // Guarda o registro completo encontrado no JSON para usar também nos botões de nível.
    let campeao_selecionado = null;

    // Inicia a consulta após o navegador montar os elementos desta página.
    carregar_campeao();

    function carregar_campeao() {
        // getItem lê o ID que a tela de match-ups guardou na sessão desta aba.
        let id_campeao = sessionStorage.getItem("id_campeao_selecionado");

        if (id_campeao != null && Number(id_campeao) > 0) {
            // O primeiro then recebe a resposta HTTP da rota que já existe.
            fetch("/campeao/listar_campeao").then(function (resposta) {
                if (resposta.ok) {
                    // Retorna a leitura do JSON para o próximo then aguardar os dados.
                    return resposta.json();
                } else {
                    // O fetch não trata um status HTTP de erro sozinho; lançamos para o catch.
                    throw new Error("Não foi possível consultar os campeões.");
                }
            }).then(function (campeoes) {
                // Percorre a lista e guarda apenas o registro com o ID escolhido no card.
                for (let i = 0; i < campeoes.length; i++) {
                    if (Number(campeoes[i].id) == Number(id_campeao)) {
                        campeao_selecionado = campeoes[i];
                    }
                }

                if (campeao_selecionado != null) {
                    preencher_campeao();
                } else {
                    mostrar_erro_campeao("Campeão não encontrado. Escolha outro na tela de Match-ups.");
                }
            }).catch(function (erro) {
                // Trata falhas de conexão, de leitura do JSON ou o erro lançado acima.
                mostrar_erro_campeao("Não foi possível carregar o campeão. Tente recarregar a página.");
                console.error("Erro ao carregar campeão:", erro);
            });
        } else {
            // Sem um ID válido, orienta o usuário a selecionar um card primeiro.
            mostrar_erro_campeao("Selecione um campeão na tela de Match-ups.");
        }
    }

    function preencher_campeao() {
        // Preenche os textos nos elementos já existentes, sem criar outra estrutura HTML.
        document.getElementById("nome_campeao").textContent = campeao_selecionado.nome;
        document.getElementById("descricao_campeao").textContent = campeao_selecionado.descricao;
        document.getElementById("dica_geral_1").textContent = campeao_selecionado.dica_geral_1;
        document.getElementById("dica_geral_2").textContent = campeao_selecionado.dica_geral_2;
        document.getElementById("dica_geral_3").textContent = campeao_selecionado.dica_geral_3;
        document.getElementById("dica_ouro").textContent = campeao_selecionado.dica_ouro;
        document.getElementById("dificuldade_campeao").textContent = campeao_selecionado.dificuldade;

        // O ::before usa esta variável CSS, que recebe a URL do campo backGroundIMG do banco.
        document.getElementById("conteudo_superior").style.setProperty(
            "--imagem_campeao", 'url("' + campeao_selecionado.backGroundIMG + '")'
        );

        // Habilita os botões somente depois que as dicas do campeão estão disponíveis.
        let botoes_nivel = document.querySelectorAll("#botoes_nivel .botao");
        for (let i = 0; i < botoes_nivel.length; i++) {
            botoes_nivel[i].disabled = false;
        }

        // Consulta o banco antes de liberar o coração, inclusive ao recarregar a página.
        consultar_curtida();

        atualizar_dificuldade();
        mostrar_dica_nivel(1);
    }

    function consultar_curtida() {
        // O login guarda o ID do usuário na sessão; o campeão já foi carregado nesta página.
        let id_usuario = Number(sessionStorage.ID_USUARIO);
        let botao_favoritar = document.getElementById("btn_favoritar");
        botao_favoritar.disabled = true;

        // Sem um usuário logado, não é possível consultar ou registrar sua curtida.
        if (!Number.isInteger(id_usuario) || id_usuario <= 0) {
            botao_favoritar.title = "Faça login para favoritar uma match-up";
            return;
        }

        botao_favoritar.title = "Consultando favorito...";

        // no-store pede uma resposta atual da API, em vez de reutilizar uma consulta em cache.
        // Os IDs depois do ? são lidos pelo controller usando req.query.
        fetch("/campeao/consultar_curtida?id_usuario=" + id_usuario + "&id_campeao=" + campeao_selecionado.id, {
            cache: "no-store"
        }).then(function (resposta) {
            if (resposta.ok) {
                return resposta.json();
            } else {
                throw new Error("Não foi possível consultar a curtida.");
            }
        }).then(function (curtidas) {
            // Um registro significa que este usuário já favoritou este campeão.
            atualizar_coracao(curtidas.length > 0);
            botao_favoritar.disabled = false;
        }).catch(function (erro) {
            // Mantém o botão bloqueado enquanto não sabemos o estado real no banco.
            botao_favoritar.title = "Recarregue a página para consultar o favorito";
            alert("Não foi possível consultar seu favorito. Tente recarregar a página.");
            console.error("Erro ao consultar curtida:", erro);
        });
    }

    function favoritar_match_up() {
        let botao_favoritar = document.getElementById("btn_favoritar");
        let id_usuario = Number(sessionStorage.ID_USUARIO);

        // Não envia outra requisição durante o carregamento ou sem um campeão disponível.
        if (campeao_selecionado == null || botao_favoritar.disabled) {
            return;
        }

        if (!Number.isInteger(id_usuario) || id_usuario <= 0) {
            alert("Faça login para favoritar uma match-up.");
            return;
        }

        // A classe informa o último estado confirmado pelo banco.
        let estava_favoritada = botao_favoritar.classList.contains("match_up_favoritada");
        let rota_curtida;
        let configuracao_requisicao;

        if (estava_favoritada) {
            // DELETE envia os IDs no corpo em JSON, que o controller lê com req.body.
            rota_curtida = "/campeao/remover_curtida";
            configuracao_requisicao = {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    id_usuario: id_usuario,
                    id_campeao: campeao_selecionado.id
                })
            };
        } else {
            // POST reutiliza o cadastro existente e envia os IDs no corpo em JSON.
            rota_curtida = "/campeao/cadastrar_curtida";
            configuracao_requisicao = {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    id_usuario: id_usuario,
                    id_campeao: campeao_selecionado.id
                })
            };
        }

        // Bloqueia cliques repetidos e só altera o coração depois da confirmação da API.
        botao_favoritar.disabled = true;
        fetch(rota_curtida, configuracao_requisicao).then(function (resposta) {
            if (resposta.ok) {
                atualizar_coracao(!estava_favoritada);
                botao_favoritar.disabled = false;
            } else {
                throw new Error("Não foi possível atualizar a curtida.");
            }
        }).catch(function (erro) {
            // Em caso de falha, preserva o último estado confirmado e permite tentar novamente.
            botao_favoritar.disabled = false;
            alert("Não foi possível atualizar seu favorito. Tente novamente.");
            console.error("Erro ao atualizar curtida:", erro);
        });
    }

    function atualizar_coracao(favoritada) {
        // Usa o mesmo CSS e a mesma transição para mostrar o estado confirmado da curtida.
        let botao_favoritar = document.getElementById("btn_favoritar");
        if (favoritada) {
            botao_favoritar.classList.add("match_up_favoritada");
            botao_favoritar.title = "Remover match-up dos favoritos";
        } else {
            botao_favoritar.classList.remove("match_up_favoritada");
            botao_favoritar.title = "Favoritar match-up";
        }
    }

    function atualizar_dificuldade() {
        // Define quantos indicadores devem ficar ativos de acordo com a dificuldade.
        let quantidade_ativos = 0;

        if (campeao_selecionado.dificuldade == "Fácil") {
            quantidade_ativos = 1;
        } else if (campeao_selecionado.dificuldade == "Média") {
            quantidade_ativos = 2;
        } else if (campeao_selecionado.dificuldade == "Difícil") {
            quantidade_ativos = 3;
        }

        // O índice começa em 0: ativa os primeiros e desativa os que sobram.
        let parametros = document.querySelectorAll("#indicadores_dificuldade .parametro");
        for (let i = 0; i < parametros.length; i++) {
            if (i < quantidade_ativos) {
                parametros[i].classList.add("parametro-ativo");
            } else {
                parametros[i].classList.remove("parametro-ativo");
            }
        }
    }

    function mostrar_dica_nivel(nivel) {
        // Não troca dicas enquanto a consulta ainda não encontrou o campeão.
        if (campeao_selecionado == null) {
            return;
        }

        // Retira o destaque anterior para marcar somente o botão escolhido.
        let botoes_nivel = document.querySelectorAll("#botoes_nivel .botao");
        for (let i = 0; i < botoes_nivel.length; i++) {
            botoes_nivel[i].classList.remove("botao-ativo");
        }

        // Cada número recebido pelo onclick corresponde a uma faixa de nível.
        if (nivel == 1) {
            document.getElementById("titulo_dica_nivel").textContent = "Nivel 1 ao 5";
            document.getElementById("dica_nivel").textContent = campeao_selecionado.dica_nivel_1_5;
            document.getElementById("btn_nivel_1_5").classList.add("botao-ativo");
        } else if (nivel == 2) {
            document.getElementById("titulo_dica_nivel").textContent = "Nivel 6 ao 11";
            document.getElementById("dica_nivel").textContent = campeao_selecionado.dica_nivel_6_11;
            document.getElementById("btn_nivel_6_11").classList.add("botao-ativo");
        } else if (nivel == 3) {
            document.getElementById("titulo_dica_nivel").textContent = "Nivel 12 ao máximo";
            document.getElementById("dica_nivel").textContent = campeao_selecionado.dica_nivel_12_max;
            document.getElementById("btn_nivel_12_max").classList.add("botao-ativo");
        }
    }

    function mostrar_erro_campeao(mensagem) {
        // Usa os próprios espaços de nome e descrição para informar o problema.
        document.getElementById("nome_campeao").textContent = "Campeão indisponível";
        document.getElementById("descricao_campeao").textContent = mensagem;
    }
</script>
