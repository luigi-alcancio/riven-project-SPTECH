<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/cadastro.css">
  <link rel="stylesheet" href="./css/global.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>

  <main class="login">

    <section class="lado-esquerdo">


    </section>

    <section class="lado-direito">

      <div class="form-caixa">

        <header class="form-cabecalho">
          <div class="avatar-caixa">
            <img src="assets/imgs/avatar_riven.png" class="form-avatar">
          </div>
          <h1>CADASTRO</h1>
          <p>Sua jornada começa aqui</p>
        </header>

        <form>

          <div class="campo">
            <label for="nome_input">Nome de usuário</label>
            <input type="text" id="nome_input">
          </div>
          <div class="campo">
            <label for="email_input">Email</label>
            <input type="text" id="email_input">
          </div>
          <div class="campo">
            <label for="senha_input">Senha</label>
            <input type="password" id="senha_input" onkeyup="verificarSenha()">
            <div id="div_mensagem_senha"></div>
          </div>

          <div class="campo">
            <label for="confirmacao_senha_input">Confirmar senha</label>
            <input type="password" id="confirmacao_senha_input" onkeyup="verificarConfirmarSenha()">
            <div id="div_mensagem_confirmar_senha"></div>
          </div>
          <div class="form-opcoes">
            <label><input type="checkbox" class="checkbox"> Li e aceito os
              <a href="#" class="remove-sublinhado">termos de uso</a> e
              <a href="#" class="remove-sublinhado">políticas de privacidade</a></label>
          </div>

          <button onclick="cadastrar()" class="botao" type="button">Cadastrar</button>
        </form>

        <p class="form-rodape">Já tem cadastro?<a href="login.html" class="remove-sublinhado"> Faça login</a></p>
        <a href="index.html" class="link-voltar">← Voltar à pagina inicial</a>

        <div id="mensagem_erro" class="mensagem_erro"></div>

      </div>

      <div class="divisoria">
        <img src="assets/imgs/divisoria.png">
        <img src="assets/imgs/divisoria.png">
      </div>


    </section>

  </main>

</body>

</html>

<script>
  let criterios = 0;
  let senhasIguais;

  function cadastrar() {
    // aguardar();
    
    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    let nomeVar = nome_input.value;
    let emailVar = email_input.value;
    let senhaVar = senha_input.value;
    let confirmacaoSenhaVar = confirmacao_senha_input.value;

    verificarConfirmarSenha()

    if(nomeVar == ''){
      alert("Erro: Por favor insira um nome");
      return false;
    }

    if(emailVar == ''){
      alert("Erro: Por favor insira um email");
      return false;
    }

    if(!emailVar.includes('@')){
      alert("Erro: Por favor insira um email válido");
      return false;
    }

    if (!(criterios == 3)){
      alert("Erro: Por favor insira uma senha forte");
      return false;
    }

    if (!senhasIguais) {
      alert("Erro: As senhas precisam ser iguais!");
      return false;
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function verificarSenha() {
    let senha = senha_input.value;
    let tamanho = senha.length >= 8;
    let maiusculas = senha != senha.toLowerCase();
    let minusculas = senha != senha.toUpperCase();
    criterios = 0;

    if (tamanho) criterios++;
    if (maiusculas) criterios++;
    if (minusculas) criterios++;

    if (criterios == 3) {
      div_mensagem_senha.innerHTML = ''
    } else if (criterios == 2 && senha.length > 4) {
      div_mensagem_senha.innerHTML = `Senha Média. Utilize maiúsculas, minúsculas <br> e pelo menos 8 caracteres.`  // atingiu 2 critérios de segurança
    } else if (criterios == 2) {
      div_mensagem_senha.innerHTML = `Senha Fraca. Utilize maiúsculas, minúsculas <br> e pelo menos 8 caracteres.`  // atingiu 2 critérios de segurança
    } else if (criterios == 1) {
      div_mensagem_senha.innerHTML = `Senha Insegura. Utilize maiúsculas, minúsculas <br> e pelo menos 8 caracteres.`  // atingiu 1 critério de segurança
    } else {
      div_mensagem_senha.innerHTML = `Senha Insegura. Utilize maiúsculas, minúsculas <br> e pelo menos 8 caracteres.`  // não atingiu nenhum critério de segurança  
    }

  }

  function verificarConfirmarSenha() {
    let senha = senha_input.value;
    let confirmarSenha = confirmacao_senha_input.value;

    if(senha == confirmarSenha){
      div_mensagem_confirmar_senha.innerHTML = ``
      senhasIguais = true
    }else{
      senhasIguais = false
      div_mensagem_confirmar_senha.innerHTML = `As senhas precisam ser iguais!`
    }
  }
</script>
